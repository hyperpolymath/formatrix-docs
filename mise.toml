[tools]
# Language runtimes
rust = "latest"
zig = "latest"
bun = "latest"

# Package managers
cargo = "latest"

# Formatting & Linting
shfmt = "latest"
stylua = "latest"

# Build tools
cmake = "latest"
ninja = "latest"
just = "latest"

# Shell tools
git = "latest"
gnu-sed = "latest"
gnu-tar = "latest"
gnu-grep = "latest"

# Testing

[env]
# Common environment variables

# Task runner aliases
[tasks]
task = "just"
build = "cargo build --release || bun run build"
test = "cargo test || bun test"
lint = "bunx --no-install --bun prettier --check ."
fmt = "bunx --no-install --bun prettier --write ."
